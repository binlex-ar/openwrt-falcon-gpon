name: Build OpenWrt 25 for Lantiq Falcon SFP with Open GPON

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync unzip zlib1g-dev \
            file wget qemu-utils device-tree-compiler

      - name: Clone OpenWrt (master / 25.x)
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt

      - name: Inject GPON Falcon driver, OMCI daemon and firmware
        run: |
          mkdir -p openwrt/package/kernel openwrt/package/network/services
          cp -r package/kernel/gpon-falcon openwrt/package/kernel/
          cp -r package/network/services/* openwrt/package/network/services/
          if [ -d target ]; then
            cp -r target/* openwrt/target/
          fi
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure OpenWrt target
        run: |
          cd openwrt
          cp ../falcon_sfp.diffconfig .config
          make defconfig

      - name: Download source tarballs
        run: |
          cd openwrt
          make download -j8

      - name: Compile OpenWrt Toolchain, Kernel and Images
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=sc

      - name: Archive firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25-falcon-sfp-firmware
          path: |
            openwrt/bin/targets/lantiq/falcon/*sysupgrade.bin
            openwrt/bin/targets/lantiq/falcon/*image*
            openwrt/bin/targets/lantiq/falcon/packages/*gpon*
            openwrt/bin/packages/mips_24kc/*/*gpon*
            openwrt/bin/packages/mips_24kc/*/omcid*

